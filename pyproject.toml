[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pinlaser"
version = "1.0.0"
description = "A Windows tray app that draws a glowing laser pointer on screen"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.6",
]

[project.scripts]
pinlaser = "main:main"

[tool.setuptools]
py-modules = [
    "main",
    "overlay",
    "laser",
    "hotkeys",
    "settings",
    "settings_dialog",
    "win_utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
