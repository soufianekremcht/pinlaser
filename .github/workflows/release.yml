# Release workflow: tag-driven build, optional code signing, GitHub release.
#
# Build + unsigned release: works out of the box on every `v*` tag push.
# Code signing (SignPath Foundation): activates automatically once these are
# configured in the repo settings (after SignPath Foundation approval):
#   Secret  SIGNPATH_API_TOKEN          https://app.signpath.io -> Integrations -> API tokens
#   Secret  SIGNPATH_ORGANIZATION_ID    organization dashboard -> Settings -> Organization ID
#   Variable SIGNPATH_PROJECT_SLUG      SignPath project slug (create "pinlaser" project)
#   Variable SIGNPATH_SIGNING_POLICY    SignPath signing policy slug (e.g. "release-signing")
# See https://docs.signpath.io for the exact Foundation onboarding steps.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
  SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
  SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
  SIGNPATH_SIGNING_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: py -m pip install --upgrade pip && py -m pip install "PySide6>=6.6" "pyinstaller>=6.0"

      - name: Check tag matches project version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $pyproject = Get-Content pyproject.toml -Raw
          if ($pyproject -notmatch ('version\s*=\s*"' + [regex]::Escape($tag) + '"')) {
            Write-Error "Tag '${{ github.ref_name }}' does not match pyproject.toml version (expected $tag)"
          }

      - name: Build PinLaser.exe
        shell: cmd
        run: packaging\build.bat

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _out | Out-Null
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Compress-Archive -Path dist\PinLaser.exe, README.md `
            -DestinationPath "_out\PinLaser-$version.zip" -Force
          Get-ChildItem _out

      - name: Upload unsigned artifact
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: pinlaser-unsigned
          path: _out/*.zip
          if-no-files-found: error

      # Skipped until the SIGNPATH secrets/variables above exist in repo settings.
      # After SignPath approval, the Foundation artifact configuration consumes the
      # uploaded unsigned zip, signs PinLaser.exe inside it, and this step downloads
      # the signed zip in its place.
      - name: Submit signing request (SignPath)
        id: signpath
        if: >
          env.SIGNPATH_API_TOKEN != '' &&
          env.SIGNPATH_ORGANIZATION_ID != '' &&
          env.SIGNPATH_PROJECT_SLUG != '' &&
          env.SIGNPATH_SIGNING_POLICY != ''
        uses: SignPath/github-action-submit-signing-request/v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          skip-decompress: true
          output-artifact-directory: _out

      - name: Verify signed artifact
        if: steps.signpath.outputs.signing-request-id != ''
        shell: pwsh
        run: |
          $zip = Get-ChildItem _out/*.zip | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Write-Host "Pending/artifact zip: $($zip.Name) ($([math]::Round($zip.Length/1MB, 1)) MB)"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Pin Laser ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          body: |
            ## Download

            1. Extract the ZIP and double-click `PinLaser.exe`
            2. Press `Ctrl+Shift+L` to toggle the laser pointer

            > **First run:** Windows SmartScreen may show *"Windows protected your PC"* —
            > click **More info → Run anyway**. See the README for details.

            Requirements: Windows 10/11 (64-bit). Full changelog: see `README.md` and commit history.
          files: _out/*.zip
